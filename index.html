<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Focus – Student Registration</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue-dark:  #0a2463;
            --blue:       #1b6ca8;
            --blue-light: #e8f4fb;
            --accent:     #e8a317;
            --text:       #1a1a2e;
            --muted:      #64748b;
            --border:     #dde3ea;
            --white:      #ffffff;
            --bg:         #f4f7fa;
            --success-bg: #ecfdf5;
            --success-fg: #065f46;
            --error-bg:   #fef2f2;
            --error-fg:   #991b1b;
            --radius:     12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 16px;
            color: var(--text);
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
        }

        /* ── CARD ── */
        .card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(10,36,99,.10), 0 1px 4px rgba(10,36,99,.06);
            overflow: hidden;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(160deg, var(--blue-dark) 0%, var(--blue) 100%);
            padding: 40px 32px 36px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 24px;
            background: var(--white);
            border-radius: 24px 24px 0 0;
        }

        .logo-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,.25);
            overflow: hidden;
        }

        .logo-wrap img {
            width: 78px;
            height: 78px;
            object-fit: contain;
        }

        .event-label {
            display: inline-block;
            background: var(--accent);
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: rgba(255,255,255,.75);
            font-weight: 500;
        }

        .counter-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.25);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: var(--white);
        }

        .counter-pill .num {
            font-size: 18px;
            font-weight: 800;
        }

        .counter-pill.full {
            background: rgba(220,53,69,.25);
            border-color: rgba(220,53,69,.4);
        }

        /* ── FORM BODY ── */
        .body {
            padding: 32px 32px 36px;
        }

        .field + .field { margin-top: 20px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            transition: border-color .2s, box-shadow .2s, background .2s;
            -webkit-appearance: none;
        }

        input::placeholder { color: #b0bec5; }

        input:focus {
            outline: none;
            border-color: var(--blue);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(27,108,168,.12);
        }

        /* ── ACTIONS ── */
        .actions {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .2px;
            cursor: pointer;
            transition: all .25s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
            color: var(--white);
            box-shadow: 0 4px 14px rgba(10,36,99,.25);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(10,36,99,.3);
        }

        .btn-primary:active:not(:disabled) { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--blue);
            border: 2px solid var(--border);
        }

        .btn-outline:hover { border-color: var(--blue); background: var(--blue-light); }

        /* ── TOAST ── */
        .toast {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .toast.show { display: block; }
        .toast.success { background: var(--success-bg); color: var(--success-fg); border-color: #10b981; }
        .toast.error   { background: var(--error-bg);   color: var(--error-fg);   border-color: #ef4444; }

        /* ── FULL STATE ── */
        .full-state {
            padding: 56px 32px 48px;
            text-align: center;
        }

        .full-icon { font-size: 64px; margin-bottom: 20px; }

        .full-state h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 10px;
        }

        .full-state p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ── QR FLOAT ── */
        .qr-float {
            position: fixed;
            bottom: 20px; right: 20px;
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,.18);
            z-index: 999;
            display: none;
        }

        .qr-float.show { display: block; animation: pop .25s ease; }

        @keyframes pop {
            from { transform: scale(.9) translateY(8px); opacity: 0; }
            to   { transform: scale(1) translateY(0);    opacity: 1; }
        }

        .qr-float h4 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            text-align: center;
        }

        .qr-float p {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-top: 10px;
        }

        .qr-in-card {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg);
            border-radius: var(--radius);
            display: none;
            justify-content: center;
        }

        .qr-in-card.show { display: flex; }

        /* ── RESPONSIVE ── */
        @media (max-width: 520px) {
            body { padding: 16px 12px; }
            .header { padding: 32px 24px 30px; }
            .body, .full-state { padding-left: 24px; padding-right: 24px; }
            .header h1 { font-size: 26px; }
            .qr-float { left: 12px; right: 12px; bottom: 12px; }
        }

        /* ── ADMIN PANEL ── */
        .admin-body { padding: 24px 32px 32px; }

        .admin-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn-sm { padding: 8px 14px; font-size: 13px; }
        a.btn-sm { text-decoration: none; display: inline-flex; align-items: center; }

        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        thead th {
            background: var(--blue-dark);
            color: var(--white);
            padding: 10px 12px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:nth-child(even) td { background: var(--bg); }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>

  <h4>📱 Scan to Register</h4>
  <div id="qrFloatCode"></div>
  <p>Share this with students</p>
</div>

<script>
const MAX = 200;
const KEY = 'futureFocusRegs';

// ── GOOGLE SHEETS INTEGRATION ──────────────────────────────────────────────
// 1. Follow setup instructions in Code.gs to create your Apps Script Web App
// 2. Paste your Web App URL here:
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzVrbvQZaQ-WqQG6WL-LDExz5aPhSkP4ePxpZCNK3Mee9kokJjOx6afCg0TEU5NOZPq/exec';
// Admin panel password  →  open via: ?admin=orbit2025
const ADMIN_PASS = 'orbit2025';
// ──────────────────────────────────────────────────────────────────────────

function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
}

function save(data) {
    localStorage.setItem(KEY, JSON.stringify(data));
}

let regs = load();

function updatePill() {
    document.getElementById('count').textContent = regs.length;
    document.getElementById('pill').classList.toggle('full', regs.length >= MAX);
}

// Fire-and-forget POST to Google Sheets (no-cors avoids preflight issues)
function syncToSheet(entry) {
    if (!SHEET_URL) return;
    fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(entry)
    }).catch(() => {});
}

function escHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function downloadCSV() {
    const headers = ['#', 'Student Number', 'Surname & Initial', 'Program', 'Registered At'];
    const rows = regs.map((r, i) => [i + 1, r.studentNo, r.surname, r.program, r.at]);
    const csv = [headers, ...rows]
        .map(row => row.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))
        .join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = 'future-focus-registrations.csv';
    a.click();
}

async function refreshFromSheet() {
    if (!SHEET_URL) return;
    const btn = document.getElementById('refreshBtn');
    if (btn) { btn.textContent = 'Loading…'; btn.disabled = true; }
    try {
        const res = await fetch(SHEET_URL);
        const data = await res.json();
        if (data.data && Array.isArray(data.data)) {
            regs = data.data.map(r => ({
                studentNo: String(r.studentNo),
                surname:   String(r.surname),
                program:   String(r.program),
                at:        String(r.at)
            }));
            save(regs);
            updatePill();
            renderAdmin();
            return;
        }
    } catch (e) {}
    renderAdmin(false);
    if (btn) { btn.textContent = '↻ Refresh from Sheets'; btn.disabled = false; }
    alert('Could not reach Google Sheets. Check that the Web App is deployed with "Anyone" access.');
}

function renderAdmin(loading) {
    document.querySelector('.wrapper').style.maxWidth = '960px';
    const el = document.getElementById('content');
    const rows = regs.map((r, i) => `
        <tr>
            <td>${i + 1}</td>
            <td>${escHtml(r.studentNo)}</td>
            <td>${escHtml(r.surname)}</td>
            <td>${escHtml(r.program)}</td>
            <td>${escHtml(r.at)}</td>
        </tr>`).join('');

    const tableBody = loading
        ? `<div class="empty-state">Loading registrations from Google Sheets…</div>`
        : regs.length === 0
            ? `<div class="empty-state">No registrations found in Google Sheets yet.</div>`
            : `<table>
                <thead>
                    <tr><th>#</th><th>Student No</th><th>Surname &amp; Initial</th><th>Program</th><th>Registered At</th></tr>
                </thead>
                <tbody>${rows}</tbody>
               </table>`;

    el.innerHTML = `
        <div class="admin-body">
            <div class="admin-actions">
                <button class="btn btn-primary btn-sm" onclick="downloadCSV()">⬇ Download CSV</button>
                ${SHEET_URL ? '<button id="refreshBtn" class="btn btn-outline btn-sm" onclick="refreshFromSheet()">↻ Refresh from Sheets</button>' : ''}
                <a href="${window.location.pathname}" class="btn btn-outline btn-sm">← Back to Form</a>
            </div>
            <div class="table-wrap">${tableBody}</div>
        </div>`;
}

function renderForm() {
    const el = document.getElementById('content');

    if (regs.length >= MAX) {
        el.innerHTML = `
            <div class="full-state">
                <div class="full-icon">🎓</div>
                <h2>Registration Full</h2>
                <p>All 200 spots for Future Focus have been filled. Thank you for your interest in Orbit College!</p>
                <button class="btn btn-outline" onclick="toggleQR()">📱 Share QR Code</button>
                <div class="qr-in-card" id="qrInCard"></div>
            </div>`;
        return;
    }

    el.innerHTML = `
        <div class="body">
            <div id="toast" class="toast"></div>

            <form id="regForm">
                <div class="field">
                    <label for="studentNo">Student Number</label>
                    <input id="studentNo" type="text" placeholder="e.g. 12345678" required>
                </div>
                <div class="field">
                    <label for="surname">Surname &amp; Initial</label>
                    <input id="surname" type="text" placeholder="e.g. Mokoena T" required>
                </div>
                <div class="field">
                    <label for="program">Program</label>
                    <input id="program" type="text" placeholder="e.g. NC: Business Administration" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Register Now</button>
                    <button type="button" class="btn btn-outline" onclick="toggleQR()">📱 Share QR Code</button>
                </div>
            </form>
        </div>`;

    document.getElementById('regForm').addEventListener('submit', handleSubmit);
}

function handleSubmit(e) {
    e.preventDefault();

    if (regs.length >= MAX) {
        showToast('Registration is full. No more spots available.', 'error');
        return;
    }

    const entry = {
        studentNo: document.getElementById('studentNo').value.trim(),
        surname:   document.getElementById('surname').value.trim(),
        program:   document.getElementById('program').value.trim(),
        at:        new Date().toLocaleString('en-ZA')
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Registering…';

    setTimeout(() => {
        regs.push(entry);
        save(regs);
        syncToSheet(entry);
        updatePill();

        if (regs.length >= MAX) {
            renderForm();
        } else {
            document.getElementById('regForm').reset();
            showToast('✅ Registered as #' + regs.length + ' — Welcome to Future Focus!', 'success');
            btn.disabled = false;
            btn.textContent = 'Register Now';
        }
    }, 350);
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'toast show ' + type;
    if (type === 'success') setTimeout(() => { t.className = 'toast'; }, 4000);
}

let qrBuilt = false;

function toggleQR() {
    const flt = document.getElementById('qrFloat');
    const isOpen = flt.classList.contains('show');

    if (isOpen) {
        flt.classList.remove('show');
    } else {
        flt.classList.add('show');
        if (!qrBuilt) {
            new QRCode(document.getElementById('qrFloatCode'), {
                text: window.location.href,
                width: 180, height: 180,
                correctLevel: QRCode.CorrectLevel.H
            });
            qrBuilt = true;
        }
        const inCard = document.getElementById('qrInCard');
        if (inCard && !inCard.classList.contains('show')) {
            inCard.classList.add('show');
            new QRCode(inCard, {
                text: window.location.href,
                width: 180, height: 180,
                correctLevel: QRCode.CorrectLevel.H
            });
        }
    }
}

// init
updatePill();
const _params = new URLSearchParams(window.location.search);
if (_params.get('admin') === ADMIN_PASS) {
    renderAdmin(true);          // show loading state immediately
    refreshFromSheet();         // auto-fetch from Google Sheets
} else {
    renderForm();
}
</script>
